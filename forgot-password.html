<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot password — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 col-md-4 w-100">
      <h4 class="fw-bold mb-2">Forgot your password?</h4>
      <p class="text-muted small mb-3">Enter your email and we'll send you a link to reset it.</p>
      <div id="alertBox" class="alert d-none"></div>
      <form id="forgotForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Send reset link</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="/login.html">Back to login</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      const data = Object.fromEntries(new FormData(form));
      const button = form.querySelector("button");

      await withButtonLoading(button, "Sending...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await res.json();

        alertBox.textContent = result.message;
        alertBox.className = `alert ${result.success ? "alert-success" : "alert-danger"}`;
      });
    });
  </script>
</body>
</html>
