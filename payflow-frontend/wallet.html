<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wallet — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/payflow-frontend/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Fund wallet</h5>
          <div id="fundAlert" class="alert d-none"></div>
          <form id="fundForm">
            <div class="mb-3">
              <label class="form-label">Amount (₦)</label>
              <input type="number" min="100" name="amount" class="form-control" required />
            </div>
            <button class="btn btn-success w-100" type="submit">Fund with Paystack</button>
          </form>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Send money</h5>
          <div id="transferAlert" class="alert d-none"></div>
          <form id="transferForm">
            <div class="mb-3">
              <label class="form-label">Recipient account number</label>
              <input type="text" name="toAccountNumber" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Amount (₦)</label>
              <input type="number" min="1" name="amount" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Transaction PIN</label>
              <input type="password" name="pin" maxlength="4" class="form-control" required />
            </div>
            <button class="btn btn-success w-100" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <div class="card p-4 mt-4">
      <h5 class="fw-bold mb-3">Recent transactions</h5>
      <table class="table">
        <thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="txBody"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/payflow-frontend/js/config.js"></script>
  <script src="/payflow-frontend/js/auth.js"></script>
  <script src="/payflow-frontend/js/nav.js"></script>
  <script>
    requireAuth();
    renderNav();

    function showAlert(id, message, ok) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = `alert ${ok ? "alert-success" : "alert-danger"}`;
    }

    document.getElementById("fundForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch(`${API_BASE_URL}/api/wallet/fund/initialize`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      if (result.success) {
        window.location.href = result.data.authorization_url;
      } else {
        showAlert("fundAlert", result.message, false);
      }
    });

    document.getElementById("transferForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch(`${API_BASE_URL}/api/wallet/transfer`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      showAlert("transferAlert", result.message, result.success);
      if (result.success) {
        e.target.reset();
        loadTransactions();
      }
    });

    async function loadTransactions() {
      const res = await fetch(`${API_BASE_URL}/api/wallet/transactions`, { headers: authHeaders() });
      const result = await res.json();
      const body = document.getElementById("txBody");
      if (!result.success || !result.data.length) {
        body.innerHTML = '<tr><td colspan="4" class="text-muted">No transactions yet</td></tr>';
        return;
      }
      body.innerHTML = result.data
        .map(
          (t) => `<tr>
            <td>${t.type}</td>
            <td>₦${t.amount.toLocaleString()}</td>
            <td><span class="status-pill ${t.status}">${t.status}</span></td>
            <td>${new Date(t.createdAt).toLocaleString()}</td>
          </tr>`
        )
        .join("");
    }

    loadTransactions();
  </script>
</body>
</html>
