<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/payflow-frontend/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 col-md-5 w-100">
      <h4 class="fw-bold mb-3">Create your PayFlow account</h4>
      <div id="alertBox" class="alert alert-danger d-none"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" name="fullName" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Business name (optional)</label>
          <input type="text" name="businessName" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Phone number</label>
          <input type="tel" name="phone" class="form-control" placeholder="08012345678" required />
          <div class="form-text">This becomes your PayFlow account number.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" minlength="6" required />
        </div>
        <button class="btn btn-success w-100" type="submit">Create account</button>
      </form>
      <p class="text-center mt-3 mb-0">Already have an account? <a href="/payflow-frontend/login.html">Log in</a></p>
    </div>
  </div>

  <script src="/payflow-frontend/js/config.js"></script>
  <script src="/payflow-frontend/js/auth.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      const data = Object.fromEntries(new FormData(form));

      const res = await fetch(`${API_BASE_URL}/api/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (!result.success) {
        alertBox.textContent = result.message;
        alertBox.classList.remove("d-none");
        return;
      }
      setToken(result.data.token);
      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
