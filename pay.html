<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pay — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 col-md-5 w-100" id="payCard">
      <div class="text-center mb-3">
        <div class="rounded-circle bg-primary bg-opacity-10 mx-auto d-flex align-items-center justify-content-center" style="width:64px;height:64px;">
          <span class="fs-4">🏪</span>
        </div>
        <h5 class="fw-bold mt-3 mb-0" id="recipientName">Loading...</h5>
        <p class="text-muted small" id="recipientAccount"></p>
      </div>

      <div id="alertBox" class="alert alert-danger d-none"></div>

      <form id="payForm" class="d-none">
        <div class="mb-3">
          <label class="form-label">Your email (for receipt)</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Amount to pay (₦)</label>
          <input type="number" min="100" name="amount" id="amountInput" class="form-control" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Pay now with Paystack</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        You'll be able to choose card, bank transfer, or USSD on the next screen.
      </p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const accountNumber = params.get("account");
    const alertBox = document.getElementById("alertBox");

    async function loadRecipient() {
      if (!accountNumber) {
        document.getElementById("recipientName").textContent = "No account specified";
        return;
      }
      const res = await fetch(`${API_BASE_URL}/api/wallet/account/${accountNumber}`);
      const result = await res.json();

      if (!result.success) {
        document.getElementById("recipientName").textContent = "Account not found";
        document.getElementById("recipientAccount").textContent = "This payment link isn't valid.";
        return;
      }

      document.getElementById("recipientName").textContent = result.data.displayName;
      document.getElementById("recipientAccount").textContent = `Account ${result.data.accountNumber}`;
      document.getElementById("amountInput").value = params.get("amt") || "";
      document.getElementById("payForm").classList.remove("d-none");
    }

    document.getElementById("payForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      alertBox.classList.add("d-none");

      const res = await fetch(`${API_BASE_URL}/api/wallet/pay/${accountNumber}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (!result.success) {
        alertBox.textContent = result.message;
        alertBox.classList.remove("d-none");
        return;
      }
      window.location.href = result.data.authorization_url;
    });

    loadRecipient();
  </script>
</body>
</html>
