<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify your email — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center text-center" style="min-height:100vh;">
    <div class="card p-5 col-md-5 w-100">
      <div class="fs-1 mb-3" id="statusIcon">⏳</div>
      <h5 class="fw-bold" id="statusTitle">Verifying your email...</h5>
      <p class="text-muted" id="statusText">This only takes a moment.</p>
      <a href="/dashboard.html" class="btn btn-primary mt-2 d-none" id="continueBtn">Go to dashboard</a>
      <a href="/login.html" class="btn btn-outline-primary mt-2 d-none" id="loginBtn">Go to login</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    async function verify() {
      if (!token) {
        document.getElementById("statusIcon").textContent = "❌";
        document.getElementById("statusTitle").textContent = "Missing verification link";
        document.getElementById("statusText").textContent = "Use the link from your email.";
        document.getElementById("loginBtn").classList.remove("d-none");
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/auth/verify-email/${token}`, { method: "POST" });
        const result = await res.json();

        if (result.success) {
          document.getElementById("statusIcon").textContent = "✅";
          document.getElementById("statusTitle").textContent = "Email verified!";
          document.getElementById("statusText").textContent = result.message;
          document.getElementById("continueBtn").classList.remove("d-none");
        } else {
          document.getElementById("statusIcon").textContent = "❌";
          document.getElementById("statusTitle").textContent = "Verification failed";
          document.getElementById("statusText").textContent = result.message;
          document.getElementById("loginBtn").classList.remove("d-none");
        }
      } catch (e) {
        document.getElementById("statusIcon").textContent = "❌";
        document.getElementById("statusTitle").textContent = "Something went wrong";
        document.getElementById("statusText").textContent = "Please try again in a moment.";
        document.getElementById("loginBtn").classList.remove("d-none");
      }
    }

    verify();
  </script>
</body>
</html>
