<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment received — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center text-center" style="min-height:100vh;">
    <div class="card p-5 col-md-5 w-100">
      <div class="fs-1 mb-3" id="statusIcon">⏳</div>
      <h5 class="fw-bold" id="statusTitle">Confirming your payment...</h5>
      <p class="text-muted" id="statusText"></p>
      <a href="/dashboard.html" class="btn btn-primary mt-2">Go to dashboard</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Paystack appends the reference to the callback_url as either
    // ?reference= or ?trxref= depending on the payment channel.
    const params = new URLSearchParams(window.location.search);
    const reference = params.get("reference") || params.get("trxref");
    let attempts = 0;

    document.getElementById("statusText").innerHTML = `Reference: <code>${reference || "unknown"}</code><br>This usually takes a few seconds.`;

    async function checkStatus() {
      if (!reference) return;
      attempts++;
      try {
        const res = await fetch(`${API_BASE_URL}/api/wallet/fund/status/${reference}`);
        const result = await res.json();

        if (result.success && result.data.status === "success") {
          document.getElementById("statusIcon").textContent = "✅";
          document.getElementById("statusTitle").textContent = "Payment confirmed!";
          document.getElementById("statusText").innerHTML = "Your wallet has been credited.";
          return;
        }

        if (result.success && result.data.status === "failed") {
          document.getElementById("statusIcon").textContent = "❌";
          document.getElementById("statusTitle").textContent = "Payment failed";
          document.getElementById("statusText").innerHTML = "This payment was not successful.";
          return;
        }

        if (attempts < 15) {
          setTimeout(checkStatus, 2000);
        } else {
          document.getElementById("statusTitle").textContent = "Still confirming...";
          document.getElementById("statusText").innerHTML =
            "This is taking longer than usual. Check your dashboard in a moment.";
        }
      } catch (e) {
        if (attempts < 15) setTimeout(checkStatus, 2000);
      }
    }

    checkStatus();
  </script>
</body>
</html>
