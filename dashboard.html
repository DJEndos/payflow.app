<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <div class="row g-4">
      <!-- Wallet card -->
      <div class="col-lg-7">
        <div class="wallet-card">
          <div class="d-flex justify-content-between align-items-start mb-4">
            <div class="chip"></div>
            <span class="wallet-card-label">PayFlow Wallet</span>
          </div>
          <div class="wallet-card-label mb-1">Balance</div>
          <div class="wallet-balance mb-4" id="balance">₦...</div>
          <div class="wallet-card-label mb-1" id="displayName">...</div>
          <div class="wallet-account-number" id="accountNumber">...</div>
        </div>

        <div class="row row-cols-3 g-2 mt-1">
          <div class="col">
            <a href="/wallet.html" class="quick-action">
              <span class="icon">↓</span>
              <span class="label">Fund</span>
            </a>
          </div>
          <div class="col">
            <a href="/wallet.html" class="quick-action">
              <span class="icon">↗</span>
              <span class="label">Send</span>
            </a>
          </div>
          <div class="col">
            <a href="/bills.html" class="quick-action">
              <span class="icon">⚡</span>
              <span class="label">Pay bills</span>
            </a>
          </div>
        </div>
      </div>

      <!-- QR panel -->
      <div class="col-lg-5">
        <div class="card p-4 text-center qr-box h-100 d-flex flex-column justify-content-center">
          <p class="fw-semibold mb-1">Scan to pay</p>
          <p class="text-muted small mb-3" id="qrLabel">...</p>
          <img id="qrImg" src="" alt="Your payment QR code" class="mx-auto" style="width:170px;height:170px;" />
          <p class="text-muted small mt-3 mb-0">Customers scan this to pay you directly — no app needed on their end.</p>
        </div>
      </div>
    </div>

    <!-- Ledger -->
    <div class="ledger mt-4">
      <div class="ledger-header p-3 px-4 d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Recent activity</span>
        <a href="/wallet.html" class="small text-decoration-none" style="color:var(--forest)">View all</a>
      </div>
      <div id="ledgerBody">
        <div class="ledger-row text-muted">Loading...</div>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    requireAuth();
    renderNav();

    async function loadProfile() {
      const res = await fetch(`${API_BASE_URL}/api/user/me`, { headers: authHeaders() });
      if (res.status === 401) return logout();
      const result = await res.json();
      const u = result.data;
      document.getElementById("balance").textContent = `₦${u.walletBalance.toLocaleString()}`;
      document.getElementById("displayName").textContent = u.businessName || u.fullName;
      document.getElementById("accountNumber").textContent = u.accountNumber;
      document.getElementById("qrLabel").textContent = u.businessName || u.fullName;
    }

    async function loadQr() {
      const res = await fetch(`${API_BASE_URL}/api/wallet/qr-code`, { headers: authHeaders() });
      const result = await res.json();
      if (result.success) document.getElementById("qrImg").src = result.data.qrImage;
    }

    async function loadTransactions() {
      const res = await fetch(`${API_BASE_URL}/api/wallet/transactions`, { headers: authHeaders() });
      const result = await res.json();
      const body = document.getElementById("ledgerBody");
      if (!result.success || !result.data.length) {
        body.innerHTML = '<div class="ledger-row text-muted">No activity yet — fund your wallet or share your QR code to get started.</div>';
        return;
      }
      const inbound = ["fund", "receive"];
      body.innerHTML = result.data
        .slice(0, 6)
        .map((t) => {
          const isIn = inbound.includes(t.type);
          return `<div class="ledger-row">
            <div>
              <div class="tx-type">${t.type}</div>
              <div class="tx-date">${new Date(t.createdAt).toLocaleString()}</div>
            </div>
            <div class="text-end">
              <div class="tx-amount ${isIn ? "in" : "out"}">${isIn ? "+" : "−"}₦${t.amount.toLocaleString()}</div>
              <span class="status-pill ${t.status}">${t.status}</span>
            </div>
          </div>`;
        })
        .join("");
    }

    loadProfile();
    loadQr();
    loadTransactions();
  </script>
</body>
</html>
