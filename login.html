<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 col-md-4 w-100">
      <div class="d-flex align-items-center gap-2 mb-3">
       <a href="/index.html"><img src="/logo.png"  width="100"></a>
      </div>
      <h4 class="fw-bold mb-3">Log in to PayFlow</h4>
      <div id="alertBox" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <div class="text-end mb-3">
          <a href="/forgot-password.html" class="small">Forgot password?</a>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="text-center mt-3 mb-0">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      const data = Object.fromEntries(new FormData(form));
      const button = form.querySelector("button");

      await withButtonLoading(button, "Logging in...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await res.json();

        if (!result.success) {
          alertBox.textContent = result.message;
          alertBox.classList.remove("d-none");
          return;
        }
        setToken(result.data.token);
        window.location.href = "/dashboard.html";
      });
    });
  </script>
</body>
</html>
