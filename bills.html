<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pay Bills — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <ul class="nav nav-pills mb-4" id="billTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="airtime">Airtime</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="data">Data</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="electricity">Electricity</button></li>
    </ul>

    <div id="resultAlert" class="alert d-none"></div>

    <div class="card p-4" id="airtimePane">
      <h5 class="fw-bold mb-3">Buy airtime</h5>
      <form id="airtimeForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Network</label>
            <select name="network" class="form-select" required>
              <option value="MTN">MTN</option>
              <option value="Airtel">Airtel</option>
              <option value="Glo">Glo</option>
              <option value="9mobile">9mobile</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone number</label>
            <input type="tel" name="phone" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Amount (₦)</label>
            <input type="number" min="50" name="amount" class="form-control" required />
          </div>
        </div>
        <button class="btn btn-primary mt-3">Buy airtime</button>
      </form>
    </div>

    <div class="card p-4 d-none" id="dataPane">
      <h5 class="fw-bold mb-3">Buy data</h5>
      <form id="dataForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Network</label>
            <select name="network" class="form-select" required>
              <option value="MTN">MTN</option>
              <option value="Airtel">Airtel</option>
              <option value="Glo">Glo</option>
              <option value="9mobile">9mobile</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone number</label>
            <input type="tel" name="phone" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Plan code</label>
            <input type="text" name="planCode" class="form-control" placeholder="e.g. 1GB-30days" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Amount (₦)</label>
            <input type="number" min="50" name="amount" class="form-control" required />
          </div>
        </div>
        <button class="btn btn-primary mt-3">Buy data</button>
      </form>
    </div>

    <div class="card p-4 d-none" id="electricityPane">
      <h5 class="fw-bold mb-3">Pay electricity bill</h5>
      <form id="electricityForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Disco</label>
            <select name="disco" class="form-select" required>
              <option value="IKEDC">Ikeja Electric (IKEDC)</option>
              <option value="EKEDC">Eko Electric (EKEDC)</option>
              <option value="AEDC">Abuja Electric (AEDC)</option>
              <option value="PHEDC">Port Harcourt Electric (PHEDC)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Meter type</label>
            <select name="meterType" class="form-select" required>
              <option value="prepaid">Prepaid</option>
              <option value="postpaid">Postpaid</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Meter number</label>
            <input type="text" name="meterNumber" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Amount (₦)</label>
            <input type="number" min="500" name="amount" class="form-control" required />
          </div>
        </div>
        <button class="btn btn-primary mt-3">Pay bill</button>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    requireAuth();
    renderNav();

    document.querySelectorAll("#billTabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#billTabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        ["airtime", "data", "electricity"].forEach((tab) => {
          document.getElementById(`${tab}Pane`).classList.toggle("d-none", tab !== btn.dataset.tab);
        });
      });
    });

    function showResult(message, ok) {
      const el = document.getElementById("resultAlert");
      el.textContent = message;
      el.className = `alert ${ok ? "alert-success" : "alert-danger"}`;
    }

    function submitBill(formId, endpoint) {
      document.getElementById(formId).addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const res = await fetch(`${API_BASE_URL}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        showResult(result.success ? "Payment successful!" : result.message || "Payment failed", result.success);
        if (result.success) e.target.reset();
      });
    }

    submitBill("airtimeForm", "/api/bills/airtime");
    submitBill("dataForm", "/api/bills/data");
    submitBill("electricityForm", "/api/bills/electricity/pay");
  </script>
</body>
</html>
