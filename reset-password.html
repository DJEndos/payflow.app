<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset password — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
<a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
       <img src="/logo.png"  width="100">
      </a>
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 col-md-4 w-100">
      <h4 class="fw-bold mb-3">Set a new password</h4>
      <div id="alertBox" class="alert d-none"></div>
      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" name="password" class="form-control" minlength="6" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" name="confirmPassword" class="form-control" minlength="6" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Reset password</button>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("alertBox");
    const token = new URLSearchParams(window.location.search).get("token");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const button = form.querySelector("button");

      if (data.password !== data.confirmPassword) {
        alertBox.textContent = "Passwords don't match";
        alertBox.className = "alert alert-danger";
        return;
      }
      if (!token) {
        alertBox.textContent = "Missing reset token — use the link from your email.";
        alertBox.className = "alert alert-danger";
        return;
      }

      await withButtonLoading(button, "Resetting...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/auth/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: data.password }),
        });
        const result = await res.json();

        alertBox.textContent = result.message;
        alertBox.className = `alert ${result.success ? "alert-success" : "alert-danger"}`;

        if (result.success) {
          setTimeout(() => (window.location.href = "/login.html"), 1500);
        }
      });
    });
  </script>
</body>
</html>
