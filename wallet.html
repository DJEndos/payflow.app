<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Wallet — PayFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet" />
</head>

<body>
  <div id="pageContent">
    <h4 class="fw-bold mb-3">Wallet</h4>

    <div class="card p-4 mb-4">
      <h5 class="fw-bold mb-3">Fund wallet</h5>
      <div id="fundAlert" class="alert d-none"></div>
      <form id="fundForm" class="row g-2 align-items-end">
        <div class="col-md-8">
          <label class="form-label">Amount (₦)</label>
          <input type="number" min="100" name="amount" class="form-control" required />
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100" type="submit">Fund with Paystack</button>
        </div>
      </form>
    </div>

    <ul class="nav nav-pills mb-3" id="sendTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="payflow">Send to PayFlow user</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="bank">Send to bank account</button></li>
    </ul>

    <div class="card p-4 mb-4" id="payflowPane">
      <div id="transferAlert" class="alert d-none"></div>
      <form id="transferForm">
        <div class="mb-3">
          <label class="form-label">Recipient account number</label>
          <input type="text" name="toAccountNumber" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Amount (₦)</label>
          <input type="number" min="1" name="amount" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Transaction PIN</label>
          <input type="password" name="pin" maxlength="4" class="form-control" required />
          <div class="form-text">No PIN yet? <a href="/settings.html">Set one here</a>.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Send</button>
      </form>
    </div>

    <div class="card p-4 mb-4 d-none" id="bankPane">
      <div id="bankAlert" class="alert d-none"></div>
      <form id="bankForm">
        <div class="mb-3">
          <label class="form-label">Bank</label>
          <select name="bankCode" id="bankSelect" class="form-select" required>
            <option value="">Loading banks...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Account number</label>
          <div class="input-group">
            <input type="text" name="accountNumber" id="bankAccountNumber" maxlength="10" class="form-control"
              required />
            <button class="btn btn-outline-secondary" type="button" id="resolveBtn">Verify</button>
          </div>
          <div class="form-text" id="resolvedName"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Amount (₦)</label>
          <input type="number" min="1" name="amount" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Transaction PIN</label>
          <input type="password" name="pin" maxlength="4" class="form-control" required />
        </div>
        <button class="btn btn-primary w-100" type="submit" id="bankSubmitBtn" disabled>
          Confirm account first
        </button>
      </form>
    </div>

    <div class="card p-4">
      <h5 class="fw-bold mb-3">Recent transactions</h5>
      <table class="table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="txBody">
          <tr>
            <td colspan="4" class="text-muted">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/footer-nav.js"></script>
  <script>
    requireAuth();
    renderSidebar("wallet");
    renderFooterNav("wallet");

    function showAlert(id, message, ok) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = `alert ${ok ? "alert-success" : "alert-danger"}`;
    }

    // --- Tabs ---
    document.querySelectorAll("#sendTabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#sendTabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("payflowPane").classList.toggle("d-none", btn.dataset.tab !== "payflow");
        document.getElementById("bankPane").classList.toggle("d-none", btn.dataset.tab !== "bank");
      });
    });

    // --- Fund wallet ---
    document.getElementById("fundForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = e.target.querySelector("button");
      const data = Object.fromEntries(new FormData(e.target));

      await withButtonLoading(button, "Starting...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/wallet/fund/initialize`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (result.success) {
          window.location.href = result.data.authorization_url;
        } else {
          showAlert("fundAlert", result.message, false);
        }
      });
    });

    // --- Send to PayFlow user ---
    document.getElementById("transferForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = e.target.querySelector("button");
      const data = Object.fromEntries(new FormData(e.target));
      const form = e.target;

      await withButtonLoading(button, "Sending...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/wallet/transfer`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        showAlert("transferAlert", result.message, result.success);
        if (result.success) {
          form.reset();
          loadTransactions();
        }
      });
    });

    // --- Send to bank account ---
    let resolvedAccountName = null;

    async function loadBanks() {
      const res = await fetch(`${API_BASE_URL}/api/wallet/banks`, { headers: authHeaders() });
      const result = await res.json();
      const select = document.getElementById("bankSelect");
      if (!result.success) {
        select.innerHTML = '<option value="">Could not load banks</option>';
        return;
      }
      select.innerHTML =
        '<option value="">Select a bank</option>' +
        result.data.map((b) => `<option value="${b.code}">${b.name}</option>`).join("");
    }

    document.getElementById("resolveBtn").addEventListener("click", async () => {
      const bankCode = document.getElementById("bankSelect").value;
      const accountNumber = document.getElementById("bankAccountNumber").value;
      const resolvedEl = document.getElementById("resolvedName");
      const submitBtn = document.getElementById("bankSubmitBtn");

      if (!bankCode || accountNumber.length !== 10) {
        showAlert("bankAlert", "Select a bank and enter a 10-digit account number first", false);
        return;
      }

      resolvedEl.textContent = "Checking...";
      submitBtn.disabled = true;
      resolvedAccountName = null;

      const res = await fetch(
        `${API_BASE_URL}/api/wallet/resolve-account?accountNumber=${accountNumber}&bankCode=${bankCode}`,
        { headers: authHeaders() }
      );
      const result = await res.json();

      if (!result.success) {
        resolvedEl.textContent = "Could not verify this account";
        showAlert("bankAlert", result.message, false);
        return;
      }

      resolvedAccountName = result.data.account_name;
      resolvedEl.textContent = `✅ ${resolvedAccountName}`;
      submitBtn.disabled = false;
      submitBtn.textContent = `Send to ${resolvedAccountName}`;
    });

    // If bank or account number changes after a successful resolve, force re-verification
    ["bankSelect", "bankAccountNumber"].forEach((id) => {
      document.getElementById(id).addEventListener("input", () => {
        resolvedAccountName = null;
        document.getElementById("resolvedName").textContent = "";
        document.getElementById("bankSubmitBtn").disabled = true;
        document.getElementById("bankSubmitBtn").textContent = "Confirm account first";
      });
    });

    document.getElementById("bankForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!resolvedAccountName) {
        showAlert("bankAlert", "Verify the account first", false);
        return;
      }
      const button = document.getElementById("bankSubmitBtn");
      const data = Object.fromEntries(new FormData(e.target));
      data.accountName = resolvedAccountName;
      const form = e.target;

      await withButtonLoading(button, "Sending...", async () => {
        const res = await fetch(`${API_BASE_URL}/api/wallet/transfer-to-bank`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        showAlert("bankAlert", result.message, result.success);
        if (result.success) {
          form.reset();
          document.getElementById("resolvedName").textContent = "";
          resolvedAccountName = null;
          loadTransactions();
        }
      });
    });

    // --- Transaction history ---
    async function loadTransactions() {
      const res = await fetch(`${API_BASE_URL}/api/wallet/transactions`, { headers: authHeaders() });
      const result = await res.json();
      const body = document.getElementById("txBody");
      if (!result.success || !result.data.length) {
        body.innerHTML = '<tr><td colspan="4" class="text-muted">No transactions yet</td></tr>';
        return;
      }
      body.innerHTML = result.data
        .map(
          (t) => `<tr>
            <td>${t.type.replace("_", " ")}</td>
            <td>₦${t.amount.toLocaleString()}</td>
            <td><span class="status-pill ${t.status}">${t.status}</span></td>
            <td>${new Date(t.createdAt).toLocaleString()}</td>
          </tr>`
        )
        .join("");
    }

    loadBanks();
    loadTransactions();
  </script>
</body>

</html>
